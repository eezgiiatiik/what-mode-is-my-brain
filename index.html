<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İzmir Brain Mode</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card: #ffffff;
            --primary: #34495e;
            --accent: #3498db;
            --text: #2c3e50;
            --border: #dee2e6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            max-width: 450px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.5rem 0;
            color: var(--primary);
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin: 0;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        select {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background-color: #fff;
            font-size: 1rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #2c3e50;
        }

        #resultArea {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            display: none;
        }

        .mode-title {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .recommendation-text {
            line-height: 1.5;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>What Mode Is My Brain In?</h1>
        <p class="subtitle">Am I Sabotaging Myself in İzmir?</p>
    </header>

    <div class="input-group">
        <label for="sleep">How well did you sleep last night?</label>
        <select id="sleep">
            <option value="Poor">Poor</option>
            <option value="Okay">Okay</option>
            <option value="Good">Good</option>
        </select>
    </div>

    <div class="input-group">
        <label for="stress">How stressed do you feel right now?</label>
        <select id="stress">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
    </div>

    <div class="input-group">
        <label for="focus">How focused are you today?</label>
        <select id="focus">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
        </select>
    </div>

    <div class="input-group">
        <label for="social">Do you feel like socializing today?</label>
        <select id="social">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>
    </div>

    <div class="input-group">
        <label for="tiredness">How mentally tired do you feel?</label>
        <select id="tiredness">
            <option value="Not tired">Not tired</option>
            <option value="A little tired">A little tired</option>
            <option value="Very tired">Very tired</option>
        </select>
    </div>

    <button onclick="calculateMode()">Analyze Brain Mode</button>

    <div id="resultArea">
        <div class="mode-title" id="modeDisplay"></div>
        <div class="recommendation-text" id="recDisplay"></div>
    </div>
</div>

<script>
    function calculateMode() {
        const sleep = document.getElementById('sleep').value;
        const stress = document.getElementById('stress').value;
        const focus = document.getElementById('focus').value;
        const social = document.getElementById('social').value;
        const tiredness = document.getElementById('tiredness').value;

        let mode = "";
        let recommendation = "";

        // Application Logic using If/Else
        if (sleep === "Poor" && stress === "High" && focus === "Low") {
            mode = "Burnout Mode";
            recommendation = "Stay home and avoid crowded places.";
        } 
        else if (sleep === "Poor" && tiredness === "Very tired") {
            mode = "Zombie Mode";
            recommendation = "Take a quiet walk by the seaside in Bostanlı.";
        } 
        else if (focus === "Low" && social === "No" && stress === "Medium") {
            mode = "Sabotage Mode";
            recommendation = "Avoid overstimulating environments like malls.";
        } 
        else if (sleep === "Good" && focus === "High" && stress === "Low") {
            mode = "Productive Mode";
            recommendation = "Go study or work at a calm café in Bornova.";
        } 
        else if (stress === "High" && social === "Yes") {
            mode = "Overstimulated Mode";
            recommendation = "Spend time in a quiet park or less crowded area.";
        } 
        else if (sleep === "Okay" && focus === "Medium" && stress === "Medium") {
            mode = "Neutral Mode";
            recommendation = "Light social activity is recommended.";
        } 
        else if (tiredness === "A little tired" && focus === "Medium") {
            mode = "Recovery Mode";
            recommendation = "Relax and avoid overworking yourself.";
        } 
        else if (social === "Yes" && focus === "Low") {
            mode = "Distracted Mode";
            recommendation = "Choose a quiet place and stay alone for a while.";
        } 
        else {
            // Default fallback if no specific logic strings match perfectly
            mode = "Balanced Mode";
            recommendation = "Enjoy your day in İzmir! Maybe grab a boyoz by the sea.";
        }

        // UI Update
        document.getElementById('resultArea').style.display = 'block';
        document.getElementById('modeDisplay').innerText = "🧠 Detected: " + mode;
        document.getElementById('recDisplay').innerText = "📍 Recommendation: " + recommendation;
        
        // Smooth scroll to result
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }
</script>

</body>
</html>
